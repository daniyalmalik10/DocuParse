[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docuparse-contracts"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[tool.setuptools.packages.find]
where = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
