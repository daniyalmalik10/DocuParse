name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, document, worker]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e shared/docuparse_contracts
          pip install -e "services/${{ matrix.service }}[dev]"

      - name: Lint
        working-directory: services/${{ matrix.service }}
        run: ruff check .

      - name: Test
        working-directory: services/${{ matrix.service }}
        run: pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx ng lint

      - name: Build
        working-directory: frontend
        run: npx ng build

      - name: Test
        working-directory: frontend
        run: npx ng test --watch=false
